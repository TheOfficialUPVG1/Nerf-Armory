<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>Nerf Armory</title>

<style>
:root {
  --bg:#0b0d12;
  --surface:#151922;
  --surface2:#1d2330;
  --border:#2c3442;
  --text:#f5f7fa;
  --muted:#9299a8;
  --orange:#ff8a3d;
  --orange2:#ff641f;
  --green:#5ee27a;
  --yellow:#ffd75a;
  --red:#ff6b6b;
  --blue:#66a3ff;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  background:
    radial-gradient(circle at 50% -10%,#27202a 0%,var(--bg) 45%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "SF Pro Text",Inter,Arial,sans-serif;
  min-height:100vh;
}

button,input,select,textarea {
  font:inherit;
}

button {
  border:0;
  cursor:pointer;
}

.hidden {
  display:none!important;
}

/* TOP BAR */

.topbar {
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,18,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.topbar-inner {
  max-width:760px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand {
  font-size:21px;
  font-weight:900;
}

.brand small {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
  letter-spacing:.6px;
}

/* APP */

.app {
  max-width:760px;
  margin:auto;
  padding:22px 16px 80px;
}

.hero {
  padding:8px 2px 20px;
}

.hero h1 {
  font-size:31px;
  letter-spacing:-1px;
}

.hero p {
  color:var(--muted);
  margin-top:6px;
}

/* STATS */

.stats {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px 10px;
  text-align:center;
}

.stat-icon {
  font-size:21px;
}

.stat-value {
  font-size:25px;
  font-weight:900;
  margin-top:4px;
}

.stat-label {
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* CARDS */

.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:19px;
  margin-bottom:16px;
}

.card-title {
  font-size:20px;
  font-weight:900;
}

.card-subtitle {
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

/* ATTENTION */

.attention {
  border-color:#493a1a;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,215,90,.1),transparent 45%),
    var(--surface);
}

.attention-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.attention-item:last-child {
  border-bottom:0;
}

/* BUTTONS */

.primary {
  width:100%;
  background:white;
  color:#101217;
  border-radius:13px;
  padding:14px;
  margin-top:15px;
  font-weight:900;
}

.secondary {
  background:var(--surface2);
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
}

.danger {
  background:#2a1a1a;
  color:var(--red);
  border:1px solid #4c2727;
}

/* NAV */

.nav {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:22px;
}

.nav button {
  padding:12px 7px;
  border-radius:13px;
  background:var(--surface2);
  color:var(--muted);
  border:1px solid var(--border);
  font-size:12px;
  font-weight:800;
}

.nav button.active {
  color:white;
  background:#2a303c;
  border-color:var(--orange);
}

/* COLLECTION */

.collection-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.item-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:19px;
  overflow:hidden;
  transition:transform .15s;
}

.item-card:active {
  transform:scale(.98);
}

.item-photo {
  width:100%;
  height:145px;
  object-fit:cover;
  background:#0f1218;
}

.item-photo-placeholder {
  width:100%;
  height:145px;
  display:grid;
  place-items:center;
  font-size:45px;
  background:#10141c;
}

.item-info {
  padding:13px;
}

.item-name {
  font-weight:900;
  font-size:16px;
}

.item-type {
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.badge {
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:900;
  margin-top:9px;
}

.ready {
  color:#07160b;
  background:var(--green);
}

.benched {
  color:#241b00;
  background:var(--yellow);
}

.cleaning {
  color:#260808;
  background:var(--red);
}

/* SEARCH */

.search {
  width:100%;
  background:#0e1117;
  border:1px solid var(--border);
  color:white;
  padding:14px;
  border-radius:13px;
  outline:none;
  margin-bottom:13px;
}

.search:focus {
  border-color:var(--orange);
}

/* FORM */

.form-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:23px;
  padding:21px;
}

.form-label {
  display:block;
  color:#c9ced8;
  font-size:12px;
  font-weight:800;
  margin:15px 0 7px;
}

.input,
.select,
.textarea {
  width:100%;
  background:#0e1117;
  border:1px solid var(--border);
  color:white;
  padding:13px;
  border-radius:12px;
  outline:none;
}

.textarea {
  min-height:90px;
  resize:vertical;
}

.input:focus,
.select:focus,
.textarea:focus {
  border-color:var(--orange);
}

.photo-preview {
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:15px;
  margin-top:10px;
}

/* DETAIL */

.detail-photo {
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:19px;
  margin-bottom:17px;
}

.detail-placeholder {
  height:220px;
  display:grid;
  place-items:center;
  background:#10141c;
  border-radius:19px;
  font-size:70px;
  margin-bottom:17px;
}

.detail-row {
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.detail-row span:first-child {
  color:var(--muted);
}

.detail-row span:last-child {
  text-align:right;
  font-weight:700;
}

/* TOAST */

.toast {
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,30px);
  background:#f5f7fa;
  color:#111;
  padding:12px 17px;
  border-radius:14px;
  font-size:13px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
  white-space:nowrap;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:480px) {
  .collection-grid {
    grid-template-columns:1fr 1fr;
  }

  .item-photo,
  .item-photo-placeholder {
    height:125px;
  }
}

@media(min-width:650px) {
  .collection-grid {
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      🔫 Nerf Armory
      <small>VERSION 0.1.0</small>
    </div>

    <button
      class="secondary"
      onclick="showHome()"
    >
      🏠
    </button>
  </div>
</div>

<main id="main" class="app"></main>

<div id="toast" class="toast"></div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const APP_VERSION = "0.1.0";

let guns =
  JSON.parse(
    localStorage.getItem("nerfArmory_guns") || "[]"
  );

let magazines =
  JSON.parse(
    localStorage.getItem("nerfArmory_magazines") || "[]"
  );

let currentCollection = "guns";


/* =====================================================
   STORAGE
===================================================== */

function saveData() {
  localStorage.setItem(
    "nerfArmory_guns",
    JSON.stringify(guns)
  );

  localStorage.setItem(
    "nerfArmory_magazines",
    JSON.stringify(magazines)
  );
}


/* =====================================================
   HOME
===================================================== */

function showHome() {

  const cleaning =
    guns.filter(
      g => g.status === "Needs Cleaning"
    ).length;

  const benched =
    guns.filter(
      g => g.status === "Benched"
    ).length;

  document.getElementById("main").innerHTML = `

    <section class="hero">
      <h1>Welcome to your Armory</h1>
      <p>Track your blasters, magazines, and their condition.</p>
    </section>

    <section class="stats">

      <div class="stat">
        <div class="stat-icon">🔫</div>
        <div class="stat-value">${guns.length}</div>
        <div class="stat-label">NERF GUNS</div>
      </div>

      <div class="stat">
        <div class="stat-icon">🎯</div>
        <div class="stat-value">${magazines.length}</div>
        <div class="stat-label">MAGAZINES</div>
      </div>

      <div class="stat">
        <div class="stat-icon">🧹</div>
        <div class="stat-value">${cleaning}</div>
        <div class="stat-label">NEEDS CLEANING</div>
      </div>

      <div class="stat">
        <div class="stat-icon">🟡</div>
        <div class="stat-value">${benched}</div>
        <div class="stat-label">BENCHED</div>
      </div>

    </section>

    ${
      cleaning || benched
      ? `
      <section class="card attention">

        <div class="card-title">
          ⚠️ Needs Attention
        </div>

        <div class="card-subtitle">
          Check these items before your next play session.
        </div>

        ${
          guns
          .filter(
            g =>
              g.status === "Needs Cleaning" ||
              g.status === "Benched"
          )
          .slice(0,5)
          .map(
            g => `
              <div class="attention-item">
                <span>${escapeHTML(g.name)}</span>
                <span class="badge ${statusClass(g.status)}">
                  ${escapeHTML(g.status)}
                </span>
              </div>
            `
          )
          .join("")
        }

      </section>
      `
      : `
      <section class="card">
        <div class="card-title">✅ Armory Ready</div>
        <div class="card-subtitle">
          Nothing currently needs attention.
        </div>
      </section>
      `
    }

    <section class="nav">

      <button
        class="active"
        onclick="showCollection('guns')"
      >
        🔫 Guns
      </button>

      <button
        onclick="showCollection('magazines')"
      >
        🎯 Magazines
      </button>

      <button
        onclick="showAddMenu()"
      >
        ➕ Add
      </button>

    </section>

  `;
}


/* =====================================================
   COLLECTION
===================================================== */

function showCollection(type) {

  currentCollection = type;

  const isGun =
    type === "guns";

  const items =
    isGun ? guns : magazines;

  document.getElementById("main").innerHTML = `

    <section class="hero">
      <h1>
        ${isGun ? "🔫 Nerf Guns" : "🎯 Magazines"}
      </h1>

      <p>
        ${items.length} item${items.length === 1 ? "" : "s"} in your collection.
      </p>
    </section>

    <div class="nav">

      <button
        class="${isGun ? "active" : ""}"
        onclick="showCollection('guns')"
      >
        🔫 Guns
      </button>

      <button
        class="${!isGun ? "active" : ""}"
        onclick="showCollection('magazines')"
      >
        🎯 Magazines
      </button>

      <button
        onclick="showAddMenu()"
      >
        ➕ Add
      </button>

    </div>

    <input
      id="searchInput"
      class="search"
      placeholder="Search your collection..."
      oninput="filterCollection()"
    >

    <div id="collectionGrid" class="collection-grid">
      ${renderItems(items,isGun)}
    </div>

  `;
}


function renderItems(items,isGun) {

  if (!items.length) {

    return `
      <div class="card" style="grid-column:1/-1;text-align:center;">
        <div style="font-size:45px;">
          ${isGun ? "🔫" : "🎯"}
        </div>

        <div class="card-title" style="margin-top:10px;">
          Nothing here yet
        </div>

        <div class="card-subtitle">
          Add your first ${isGun ? "Nerf gun" : "magazine"}.
        </div>

        <button
          class="primary"
          onclick="showAddForm('${isGun ? "gun" : "magazine"}')"
        >
          ➕ Add ${isGun ? "Nerf Gun" : "Magazine"}
        </button>
      </div>
    `;
  }

  return items.map(
    (item,index) => {

      const photo =
        item.photo
        ? `<img class="item-photo" src="${item.photo}" alt="">`
        : `<div class="item-photo-placeholder">
             ${isGun ? "🔫" : "🎯"}
           </div>`;

      return `
        <article
          class="item-card"
          data-name="${escapeHTML(item.name)}"
          onclick="showDetail('${isGun ? "gun" : "magazine"}',${index})"
        >

          ${photo}

          <div class="item-info">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="item-type">
              ${
                isGun
                ? escapeHTML(item.type)
                : `${item.capacity}-round magazine`
              }
            </div>

            <span class="badge ${statusClass(item.status)}">
              ${escapeHTML(item.status)}
            </span>

          </div>

        </article>
      `;
    }
  ).join("");
}


/* =====================================================
   SEARCH
===================================================== */

function filterCollection() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const items =
    currentCollection === "guns"
    ? guns
    : magazines;

  const filtered =
    items.filter(
      item =>
        item.name
          .toLowerCase()
          .includes(query)
    );

  document.getElementById(
    "collectionGrid"
  ).innerHTML =
    renderItems(
      filtered,
      currentCollection === "guns"
    );
}


/* =====================================================
   ADD MENU
===================================================== */

function showAddMenu() {

  document.getElementById("main").innerHTML = `

    <section class="hero">
      <h1>Add to Armory</h1>
      <p>What are you adding?</p>
    </section>

    <section class="card">

      <button
        class="primary"
        onclick="showAddForm('gun')"
      >
        🔫 Add Nerf Gun
      </button>

      <button
        class="primary"
        onclick="showAddForm('magazine')"
      >
        🎯 Add Magazine
      </button>

      <button
        class="secondary"
        style="width:100%;margin-top:10px;"
        onclick="showHome()"
      >
        Cancel
      </button>

    </section>
  `;
}


/* =====================================================
   ADD FORM
===================================================== */

function showAddForm(type) {

  const gun =
    type === "gun";

  document.getElementById("main").innerHTML = `

    <section class="hero">
      <h1>
        ${gun ? "🔫 Add Nerf Gun" : "🎯 Add Magazine"}
      </h1>

      <p>
        Add the details for this item.
      </p>
    </section>

    <form
      class="form-card"
      onsubmit="saveItem(event,'${type}')"
    >

      <label class="form-label">
        Photo
      </label>

      <input
        id="photoInput"
        class="input"
        type="file"
        accept="image/*"
        onchange="previewPhoto(event)"
      >

      <img
        id="photoPreview"
        class="photo-preview hidden"
        alt="Preview"
      >

      <label class="form-label">
        Name
      </label>

      <input
        id="name"
        class="input"
        required
        placeholder="${
          gun
          ? "Example: Nerf Infinus"
          : "Example: 10 Round Magazine"
        }"
      >

      ${
        gun
        ? `
          <label class="form-label">
            Type
          </label>

          <select id="type" class="select">
            <option>Blaster</option>
            <option>Pistol</option>
            <option>Rifle</option>
            <option>Spring-Powered</option>
            <option>Motorized</option>
            <option>Rival</option>
            <option>Other</option>
          </select>

          <label class="form-label">
            Condition
          </label>

          <select id="condition" class="select">
            <option>Excellent</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Needs Repair</option>
          </select>

          <label class="form-label">
            Status
          </label>

          <select id="status" class="select">
            <option>Ready</option>
            <option>Benched</option>
            <option>Needs Cleaning</option>
          </select>

          <label class="form-label">
            Recommended Use / Range
          </label>

          <select id="recommended" class="select">
            <option>Close Range</option>
            <option>Short Range</option>
            <option>Medium Range</option>
            <option>Long Range</option>
            <option>All Ranges</option>
          </select>
        `
        : `
          <label class="form-label">
            Capacity
          </label>

          <input
            id="capacity"
            class="input"
            type="number"
            min="1"
            required
            placeholder="Example: 10"
          >

          <label class="form-label">
            Condition
          </label>

          <select id="condition" class="select">
            <option>Excellent</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Damaged</option>
          </select>

          <label class="form-label">
            Status
          </label>

          <select id="status" class="select">
            <option>Ready</option>
            <option>Benched</option>
            <option>Needs Cleaning</option>
          </select>
        `
      }

      <label class="form-label">
        Notes
      </label>

      <textarea
        id="notes"
        class="textarea"
        placeholder="Anything else you want to remember..."
      ></textarea>

      <button
        class="primary"
        type="submit"
      >
        Save to Armory
      </button>

      <button
        class="secondary"
        type="button"
        style="width:100%;margin-top:10px;"
        onclick="showHome()"
      >
        Cancel
      </button>

    </form>
  `;
}


/* =====================================================
   PHOTO
===================================================== */

let selectedPhoto = "";


function previewPhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      selectedPhoto =
        e.target.result;

      const preview =
        document.getElementById(
          "photoPreview"
        );

      preview.src =
        selectedPhoto;

      preview.classList.remove(
        "hidden"
      );
    };

  reader.readAsDataURL(file);
}


/* =====================================================
   SAVE ITEM
===================================================== */

function saveItem(event,type) {

  event.preventDefault();

  const name =
    document.getElementById("name")
      .value.trim();

  const condition =
    document.getElementById("condition")
      .value;

  const status =
    document.getElementById("status")
      .value;

  const notes =
    document.getElementById("notes")
      .value.trim();

  if (type === "gun") {

    const item = {
      name,
      photo:selectedPhoto,
      type:
        document.getElementById("type")
          .value,
      condition,
      status,
      recommended:
        document.getElementById("recommended")
          .value,
      notes
    };

    guns.push(item);

  } else {

    const item = {
      name,
      photo:selectedPhoto,
      capacity:
        Number(
          document.getElementById("capacity")
            .value
        ),
      condition,
      status,
      notes
    };

    magazines.push(item);
  }

  selectedPhoto = "";

  saveData();

  toast("✅ Added to your Armory!");

  setTimeout(
    () => {
      showCollection(
        type === "gun"
        ? "guns"
        : "magazines"
      );
    },
    500
  );
}


/* =====================================================
   DETAILS
===================================================== */

function showDetail(type,index) {

  const isGun =
    type === "gun";

  const item =
    isGun
    ? guns[index]
    : magazines[index];

  const photo =
    item.photo
    ? `<img class="detail-photo" src="${item.photo}" alt="">`
    : `<div class="detail-placeholder">
         ${isGun ? "🔫" : "🎯"}
       </div>`;

  document.getElementById("main").innerHTML = `

    <section class="hero">
      <h1>${escapeHTML(item.name)}</h1>
      <p>${isGun ? "Nerf Gun" : "Nerf Magazine"}</p>
    </section>

    <section class="card">

      ${photo}

      ${
        isGun
        ? `
          <div class="detail-row">
            <span>Type</span>
            <span>${escapeHTML(item.type)}</span>
          </div>

          <div class="detail-row">
            <span>Condition</span>
            <span>${escapeHTML(item.condition)}</span>
          </div>

          <div class="detail-row">
            <span>Status</span>
            <span class="badge ${statusClass(item.status)}">
              ${escapeHTML(item.status)}
            </span>
          </div>

          <div class="detail-row">
            <span>Recommended Use</span>
            <span>${escapeHTML(item.recommended)}</span>
          </div>
        `
        : `
          <div class="detail-row">
            <span>Capacity</span>
            <span>${item.capacity} rounds</span>
          </div>

          <div class="detail-row">
            <span>Condition</span>
            <span>${escapeHTML(item.condition)}</span>
          </div>

          <div class="detail-row">
            <span>Status</span>
            <span class="badge ${statusClass(item.status)}">
              ${escapeHTML(item.status)}
            </span>
          </div>
        `
      }

      ${
        item.notes
        ? `
          <div style="margin-top:20px;">
            <div style="color:var(--muted);font-size:12px;">
              NOTES
            </div>

            <div style="margin-top:7px;line-height:1.5;">
              ${escapeHTML(item.notes)}
            </div>
          </div>
        `
        : ""
      }

      <button
        class="primary"
        onclick="editItem('${type}',${index})"
      >
        ✏️ Edit
      </button>

      <button
        class="primary danger"
        onclick="deleteItem('${type}',${index})"
      >
        🗑️ Delete
      </button>

      <button
        class="secondary"
        style="width:100%;margin-top:10px;"
        onclick="showCollection('${isGun ? "guns" : "magazines"}')"
      >
        ← Back to Collection
      </button>

    </section>
  `;
}


/* =====================================================
   EDIT
===================================================== */

function editItem(type,index) {

  const isGun =
    type === "gun";

  const item =
    isGun
    ? guns[index]
    : magazines[index];

  selectedPhoto =
    item.photo || "";

  showAddForm(type);

  setTimeout(() => {

    document.getElementById("name").value =
      item.name;

    document.getElementById("condition").value =
      item.condition;

    document.getElementById("status").value =
      item.status;

    document.getElementById("notes").value =
      item.notes || "";

    if (isGun) {

      document.getElementById("type").value =
        item.type;

      document.getElementById("recommended").value =
        item.recommended;

    } else {

      document.getElementById("capacity").value =
        item.capacity;
    }

    const form =
      document.querySelector("form");

    form.onsubmit =
      function(event) {

        event.preventDefault();

        updateItem(type,index);
      };

    if (selectedPhoto) {

      const preview =
        document.getElementById(
          "photoPreview"
        );

      preview.src =
        selectedPhoto;

      preview.classList.remove(
        "hidden"
      );
    }

    const button =
      form.querySelector(
        "button[type='submit']"
      );

    button.textContent =
      "Save Changes";

  },20);
}


function updateItem(type,index) {

  const isGun =
    type === "gun";

  const item =
    isGun
    ? guns[index]
    : magazines[index];

  item.name =
    document.getElementById("name")
      .value.trim();

  item.photo =
    selectedPhoto;

  item.condition =
    document.getElementById("condition")
      .value;

  item.status =
    document.getElementById("status")
      .value;

  item.notes =
    document.getElementById("notes")
      .value.trim();

  if (isGun) {

    item.type =
      document.getElementById("type")
        .value;

    item.recommended =
      document.getElementById("recommended")
        .value;

  } else {

    item.capacity =
      Number(
        document.getElementById("capacity")
          .value
      );
  }

  saveData();

  selectedPhoto = "";

  toast("✅ Changes saved!");

  setTimeout(
    () => showDetail(type,index),
    500
  );
}


/* =====================================================
   DELETE
===================================================== */

function deleteItem(type,index) {

  const isGun =
    type === "gun";

  const item =
    isGun
    ? guns[index]
    : magazines[index];

  if (
    !confirm(
      `Delete "${item.name}" from your Armory?`
    )
  ) {
    return;
  }

  if (isGun) {
    guns.splice(index,1);
  } else {
    magazines.splice(index,1);
  }

  saveData();

  toast("Item removed.");

  setTimeout(
    () =>
      showCollection(
        isGun
        ? "guns"
        : "magazines"
      ),
    400
  );
}


/* =====================================================
   HELPERS
===================================================== */

function statusClass(status) {

  if (status === "Ready")
    return "ready";

  if (status === "Benched")
    return "benched";

  return "cleaning";
}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function toast(message) {

  const element =
    document.getElementById("toast");

  element.textContent =
    message;

  element.classList.add("show");

  clearTimeout(toast.timeout);

  toast.timeout =
    setTimeout(
      () =>
        element.classList.remove("show"),
      2400
    );
}


/* =====================================================
   START
===================================================== */

showHome();

</script>
